<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Standalone QA harness — hello-world</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f7f7f7;
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      canvas {
        width: 800px;
        height: 450px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: #000;
      }

      button {
        font: inherit;
        padding: 8px 12px;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Standalone QA harness — hello-world</h1>
      <canvas id="game" width="800" height="450"></canvas>
      <div class="controls">
        <button id="pick-player" type="button">Pick player</button>
        <button id="unmount" type="button">Unmount</button>
      </div>
      <div id="scoreboard-mount" class="qa-scoreboard"></div>
    </main>

    <script type="module">
      import { ensurePlayerForGame, showPicker } from "../lib/player.js";
      import { unmount } from "../lib/kaplay-loader.js";
      import { mountScoreboard } from "../lib/scoreboard-widget.js";
      import { startGame } from "./game.js";

      const main = document.querySelector("main");
      const heading = document.querySelector("h1");
      const canvas = document.querySelector("#game");
      const controls = document.querySelector(".controls");
      const scoreboardMount = document.querySelector("#scoreboard-mount");
      const pickPlayerButton = document.querySelector("#pick-player");
      const unmountButton = document.querySelector("#unmount");

      function renderHeading(player) {
        heading.textContent = `Standalone QA harness — hello-world (Playing as ${player.displayName})`;
      }

      const player = await ensurePlayerForGame(main);
      console.log("player", player);
      renderHeading(player);

      main.append(heading, canvas, controls, scoreboardMount);

      const scoreboardHandle = mountScoreboard(scoreboardMount, {
        gameId: "hello-world",
        view: "compact",
        highlightId: player.id,
      });

      // QA polling: refresh every 5s so the harness shows fresh scores after each round-end submit.
      // This is throwaway QA wiring — real F5 will refresh on the actual post-submit callback.
      const refreshInterval = setInterval(() => scoreboardHandle.refresh(), 5000);
      window.addEventListener("beforeunload", () => clearInterval(refreshInterval));

      let k = await startGame(canvas);

      pickPlayerButton.addEventListener("click", async () => {
        const nextPlayer = await showPicker(main);
        console.log("player", nextPlayer);
        renderHeading(nextPlayer);
        main.append(heading, canvas, controls, scoreboardMount);
      });

      unmountButton.addEventListener("click", () => {
        scoreboardHandle.unmount();
        clearInterval(refreshInterval);
        unmount(k, canvas);
        k = null;
        unmountButton.disabled = true;
      });
    </script>
  </body>
</html>
