<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Standalone QA harness — _template</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f7f7f7;
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      canvas {
        width: 800px;
        height: 450px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: #000;
      }

      button {
        font: inherit;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Standalone QA harness — _template</h1>
      <canvas id="game" width="800" height="450"></canvas>
      <button id="unmount" type="button">Unmount</button>
    </main>

    <script type="module">
      // Standalone QA harness — bypasses F5's game modal so a fresh game
      // can be exercised in isolation. The harness assumes the F5 contract:
      // game.js exports { meta, startGame(canvas, ctx) }.
      import { mount, unmount } from "../lib/kaplay-loader.js";
      import { unlockAudio } from "../lib/sound.js";
      import { startGame } from "./game.js";

      const canvas = document.querySelector("#game");
      const button = document.querySelector("#unmount");

      const k = await mount(canvas);
      unlockAudio(k);

      const ctx = {
        player: { id: "harness", displayName: "Harness", emoji: "🧪" },
        k,
        onRoundEnd: ({ score }) => console.log("[harness] round end", score),
        onAudioUnlock: () => unlockAudio(k),
      };

      await startGame(canvas, ctx);

      let live = k;
      button.addEventListener("click", () => {
        if (!live) return;
        unmount(live, canvas);
        live = null;
        button.disabled = true;
      });
    </script>
  </body>
</html>
